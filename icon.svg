<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Tilt Arcade app icon: a tilted neon steering wheel over a synthwave sun. © 2026 @seltos.gtx -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12062a"/><stop offset=".62" stop-color="#3a0d5e"/><stop offset="1" stop-color="#7a1a6a"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset=".5" stop-color="#ff901f"/><stop offset="1" stop-color="#ff2975"/></linearGradient>
    <radialGradient id="glow"><stop offset=".45" stop-color="#ff2975" stop-opacity=".55"/><stop offset="1" stop-color="#ff2975" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8fbff"/><stop offset="1" stop-color="#00c2e0"/></linearGradient>
    <mask id="stripes"><rect width="512" height="512" fill="#fff"/><g fill="#000"><rect y="300" width="512" height="7"/><rect y="322" width="512" height="10"/><rect y="348" width="512" height="13"/><rect y="377" width="512" height="16"/></g></mask>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#fff" opacity=".8"><circle cx="86" cy="92" r="3"/><circle cx="420" cy="76" r="2.5"/><circle cx="380" cy="150" r="2"/><circle cx="130" cy="180" r="2"/><circle cx="452" cy="210" r="2.5"/></g>
  <circle cx="256" cy="330" r="190" fill="url(#glow)"/>
  <circle cx="256" cy="330" r="132" fill="url(#sun)" mask="url(#stripes)"/>
  <rect y="404" width="512" height="108" fill="#1a0632"/>
  <g stroke="#ff2975" stroke-opacity=".7" stroke-width="3"><path d="M0 404H512M0 430H512M0 466H512M256 404V512M200 404L120 512M312 404L392 512M144 404L0 490M368 404L512 490"/></g>
  <!-- Motion arcs either side of the wheel -->
  <g fill="none" stroke="#ffd319" stroke-width="16" stroke-linecap="round"><path d="M92 246a170 170 0 0 1 36-86"/><path d="M420 246a170 170 0 0 0-36-86"/></g>
  <!-- The steering wheel, tilted -->
  <g transform="rotate(-20 256 248)">
    <circle cx="256" cy="248" r="128" fill="none" stroke="#00e5ff" stroke-opacity=".3" stroke-width="44"/>
    <circle cx="256" cy="248" r="128" fill="none" stroke="url(#rim)" stroke-width="26"/>
    <path d="M138 252H212M300 252H374M256 290V366" stroke="#e6f9ff" stroke-width="24" stroke-linecap="round"/>
    <circle cx="256" cy="252" r="44" fill="#2a1844" stroke="#ff2975" stroke-width="10"/>
    <rect x="243" y="106" width="26" height="40" rx="6" fill="#ff2975"/>
  </g>
</svg>
