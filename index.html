  html { background: #12062a; }

  main { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  a.card:active { transform: scale(0.98); }
  .thumb { display: block; width: 100%; aspect-ratio: 16 / 9; background: #120b24; }
  .thumb svg { display: block; width: 100%; height: 100%; }
  .info { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .info h2 { margin: 0; font-size: 20px; font-weight: 900; font-style: italic; letter-spacing: 0.5px; }
  .info p { margin: 0; font-size: 14px; opacity: 0.8; line-height: 1.4; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }

    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;

  }
  .play {
    margin-top: auto; align-self: flex-start; font-weight: 800; font-size: 15px; padding: 9px 22px; border-radius: 999px; color: #fff;

    display: inline-flex; align-items: center; justify-content: center; flex: none;

  .brandRow { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: stretch; }
  .igBtn {

  #adBanner .board {

  footer { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .copyright { margin: 0; font-size: 11px; opacity: 0.6; }

        <circle cx="210" cy="92" r="7" fill="#b8860b"/><circle cx="210" cy="92" r="5.5" fill="#ffd700"/>

  ];

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const grid = document.getElementById('games');
  grid.innerHTML = GAMES.map((g) => `
    <a class="card" href="${esc(g.href)}">
      <span class="thumb">${g.thumb}</span>
      <span class="info">
        <h2>${esc(g.title)}</h2>
        <p>${esc(g.desc)}</p>
        <span class="tags">${g.tags.map((t) => `<span>${esc(t)}</span>`).join('')}</span>
        <span class="play">▶ Play</span>
      </span>
    </a>`).join('') + `
    <div class="card soon" aria-label="More games coming soon">
      <span class="thumb">🎮</span>
      <span class="info"><h2>More games soon</h2><p>New games are on the way. Follow @seltos.gtx so you don't miss them.</p></span>
    </div>`;
})();
</script>
